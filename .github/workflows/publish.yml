name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already committed to main (e.g. 0.2.1)'
        required: true
        type: string
      dry_run:
        description: 'Validate packages and CI without uploading'
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RUSTUP_TOOLCHAIN: '1.99.1'
    steps:
      - name: Require main branch
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::Run this workflow from main.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install publishing toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Validate version and package archives
        run: python3 scripts/publish.py --version "$RELEASE_VERSION"

  ci:
    needs: prepare
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [prepare, ci]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RUSTUP_TOOLCHAIN: '1.99.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install publishing toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Publish missing versions in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo '::error::Configure the CARGO_REGISTRY_TOKEN repository secret.'
            exit 1
          fi
          python3 scripts/publish.py --version "$RELEASE_VERSION" --publish
